server.port=${PORT:8080}

# 1. C\u1EA5u hình \u0111\u1ECDc view JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 2. C\u1EA5u hình k\u1EBFt n\u1ED1i MySQL Online (nh\u1EADn t\u1EEB bi\u1EBFn môi tr\u01B0\u1EDDng c\u1EE7a server deploy)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate trên môi tr\u01B0\u1EDDng Production (t\u1EAFt in log SQL \u0111\u1EC3 t\u1ED1i \u01B0u hi\u1EC7u n\u0103ng)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Gi\u1EDBi h\u1EA1n kích th\u01B0\u1EDBc upload \u1EA3nh
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 5. C\u1EA5u hình Cloudinary (l\u1EA5y bi\u1EBFn môi tr\u01B0\u1EDDng ho\u1EB7c dùng giá tr\u1ECB m\u1EB7c \u0111\u1ECBnh c\u1EE7a b\u1EA1n)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:kitfbrni}
cloudinary.api-key=${CLOUDINARY_API_KEY:872633151361684}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:Xd63rfiTqywXDf8BJfzDDsoO0N4}

# 6. C\u1EA5u hình Mail Gmail SMTP g\u1EEDi OTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tuanca592@gmail.com}
spring.mail.password=${MAIL_PASSWORD:icyskzpjgbcodemv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 7. Gi\u1EDBi h\u1EA1n d\u1EEF li\u1EC7u Form POST & Swallow size
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

# 8. B\u1EA3o m\u1EADt Session Cookie khi ch\u1EA1y th\u1EF1c t\u1EBF
server.servlet.session.cookie.http-only=true